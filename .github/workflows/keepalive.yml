# Keeps the free Supabase project from pausing (it pauses after a week without use) by calling the
# database's ping() function (supabase/schema.sql) every 3 days. It reads no data.
# The publishable key is the same one already in js/sync.js, so it's fine to have here.
# If a run fails, GitHub emails the repo owner. Not needed once Supabase is on a paid plan: delete this file then.
# Run it by hand from the repo's Actions tab → Keep Supabase awake → Run workflow.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 20 */3 * *' # 20:17 UTC every 3 days (morning in NZ)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o out.txt -w '%{http_code}' -X POST \
            'https://jpfnfwfzivlwlqrdlgxg.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_vAKTq6361F1xN13IYyGnUQ_JnQkeS4V' \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code: $(cat out.txt)"
          test "$code" = 200
