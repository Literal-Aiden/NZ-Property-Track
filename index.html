<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NZ Property Tracker</title>
<meta name="theme-color" content="#c2412d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Properties">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="appbar">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"><h1>NZ Property Tracker</h1></div>
    <div class="hbtns">
    <button class="gear" id="toolbtn" aria-label="Tools and calculators" title="Tools and calculators"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg></button>
    <button class="gear" id="gear" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>
  <p class="sample" id="banner"></p>
  <div class="tabs" id="tabs">
    <button class="tab" data-i="0"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Properties</button>
    <button class="tab" data-i="1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Current</button>
    <button class="tab" data-i="2"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add new</button>
  </div>
</header>
<div class="track" id="track">
  <section class="pane" id="p0"></section>
  <section class="pane" id="p1"></section>
  <section class="pane" id="p2"></section>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheetbg" id="sheetbg"></div>
  <div class="sheetbox" id="sheetbody" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastmsg"></span><button id="undo">Undo</button></div>
<div class="sheet" id="tools" hidden>
  <div class="sheetbg" id="toolbg"></div>
  <div class="sheetbox tall" id="toolbody" role="dialog" aria-modal="true" aria-labelledby="tooltitle"></div>
</div>
<div class="sheet" id="settings" hidden>
  <div class="sheetbg" id="setbg"></div>
  <div class="sheetbox" id="setbody" role="dialog" aria-modal="true" aria-labelledby="settitle"></div>
</div>
<!-- Plain scripts sharing one global scope, no build step. main.js must load last. -->
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/receipts.js"></script>
<script src="js/sales.js"></script>
<script src="js/costs.js"></script>
<script src="js/timeline.js"></script>
<script src="js/rental.js"></script>
<script src="js/potential.js"></script>
<script src="js/settings.js"></script>
<script src="js/address.js"></script>
<script src="js/views.js"></script>
<script src="js/forms.js"></script>
<script src="js/tools.js"></script>
<script src="js/main.js"></script>
</body>
</html>
