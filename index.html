<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NZ Property Tracker</title>
<meta name="theme-color" content="#c2412d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Properties">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Light or dark chosen in Settings (blank follows the phone). Set before the page draws, so it never flashes. -->
<script>(function(){try{var t=localStorage.getItem("nzpt.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="layout.css">
</head>
<body>
<!-- Screens: four tabs (home, p0 properties, toolbody tools, setbody settings) and two full-screen pages
     opened on top of them (p1 a property, p2 adding a property). Only one screen shows at a time. -->
<main class="screens">
  <section class="screen on" id="home"></section>
  <section class="screen" id="p0"></section>
  <section class="screen" id="toolbody"></section>
  <section class="screen" id="setbody"></section>
  <section class="screen page" id="p1"></section>
  <section class="screen page" id="p2"></section>
</main>
<nav class="nav" id="nav">
  <button data-tab="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Home</button>
  <button data-tab="p0"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Properties</button>
  <button id="plusbtn" aria-label="Add"><span class="plus"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-tab="toolbody"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg>Tools</button>
  <button data-tab="setbody"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings<span class="ndot" id="setdot" hidden></span></button>
</nav>
<div class="sheet" id="plus" hidden>
  <div class="sheetbg" id="plusbg"></div>
  <div class="sheetbox" id="plusbody" role="dialog" aria-modal="true" aria-label="Add"></div>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheetbg" id="sheetbg"></div>
  <div class="sheetbox" id="sheetbody" role="dialog" aria-modal="true"></div>
</div>
<div class="sheet tour" id="tour" hidden>
  <div class="sheetbg"></div>
  <div class="tourbox" id="tourbody" role="dialog" aria-modal="true" aria-labelledby="tourt"></div>
</div>
<div class="sheet ddpick" id="pick" hidden>
  <div class="sheetbg"></div>
  <div class="sheetbox" id="pickbody" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastmsg"></span><button id="undo">Undo</button></div>
<!-- Plain scripts sharing one global scope, no build step. main.js must load last. -->
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/receipts.js"></script>
<script src="js/sales.js"></script>
<script src="js/costs.js"></script>
<script src="js/timeline.js"></script>
<script src="js/rental.js"></script>
<script src="js/potential.js"></script>
<script src="js/settings.js"></script>
<script src="js/tax.js"></script>
<script src="js/address.js"></script>
<script src="js/councils.js"></script>
<script src="js/views.js"></script>
<script src="js/home.js"></script>
<script src="js/forms.js"></script>
<script src="js/tools.js"></script>
<script src="js/tour.js"></script>
<script src="js/picker.js"></script>
<script src="js/main.js"></script>
</body>
</html>
